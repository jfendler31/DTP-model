# Torvik shot mix (team + player, shot type and distance).
# barttorvik.com returns 403 to GitHub's runners (Nov 9, 2026), so this parses pages saved from a browser:
# drop the .html files in data/torvik/inbox/ and push. (The live pull, jobs/torvik_pbp.py --years Y, is kept in the code
# in case the site ever allows it; this workflow doesn't call it.)
name: Torvik shot mix
on:
  workflow_dispatch:
  push:
    paths: ['data/torvik/inbox/**']
permissions:
  contents: write
jobs:
  torvik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - name: Parse
        run: |
          if ls data/torvik/inbox/*.htm* >/dev/null 2>&1; then
            python jobs/torvik_pbp.py --ingest data/torvik/inbox
          else
            echo "inbox empty"
          fi
      - name: Save
        run: |
          git config user.name "dtp-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/torvik
          git commit -m "torvik shot mix" || echo "nothing new"
          git pull --rebase origin main && git push origin HEAD:main
