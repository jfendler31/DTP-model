# Player histories (season stats, rosters). Put arguments for jobs/player_hist.py in triggers/player_hist.txt.
name: Player history
on:
  workflow_dispatch:
  push:
    paths: ['triggers/player_hist.txt']
permissions:
  contents: write
jobs:
  player_hist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: python jobs/player_hist.py $(cat triggers/player_hist.txt)
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Save
        run: |
          git config user.name "dtp-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/players
          git commit -m "player history" || echo "nothing new"
          git pull --rebase origin main && git push origin HEAD:main
