# Player role events from CBBD play-by-play (jobs/role_events.py).
# Runs after Rotation depth each morning (yesterday's games); on demand with "--start A --end B" in triggers/roles.txt.
name: Role events
on:
  workflow_run:
    workflows: ['Rotation depth']
    types: [completed]
  workflow_dispatch:
  push:
    paths: ['triggers/roles.txt']
permissions:
  contents: write
concurrency:
  group: roles
  cancel-in-progress: false
jobs:
  roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - name: Pull
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then ARGS="$(grep -v "^#" triggers/roles.txt | head -1)"
          else Y=$(TZ=America/New_York date -d yesterday +%F); ARGS="--start $Y --end $Y"; fi
          python jobs/role_events.py $ARGS
          [ -f jobs/roles.py ] && python jobs/roles.py || true
          [ -f jobs/roles_html.py ] && python jobs/roles_html.py || true
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
      - name: Save
        run: |
          git config user.name "dtp-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/roles
          git commit -m "role events" || echo "nothing new"
          git pull --rebase origin main && git push origin HEAD:main
