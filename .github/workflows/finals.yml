# Final scores from ESPN's scoreboard for grading (data/finals/finals_<date>.csv), when CBBD box scores lag.
# Runs on demand, or when triggers/finals.txt changes ("--date YYYY-MM-DD").
name: Finals
on:
  workflow_dispatch:
  push:
    paths: ['triggers/finals.txt']
permissions:
  contents: write
jobs:
  finals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl
      - run: python jobs/slate.py --finals $(grep -o -- '--date [0-9-]*' triggers/finals.txt || true)
      - name: Save finals
        run: |
          git config user.name "dtp-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/finals/
          git commit -m "finals" || echo "nothing new"
          git pull --rebase origin main && git push origin HEAD:main
