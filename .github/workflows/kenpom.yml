# KenPom pulls on demand. triggers/kenpom.txt: one date per line (YYYY-MM-DD) -> FanMatch for each past date (fanmatch_<date>.csv);
# a line "today" also pulls today's ratings + FanMatch (what the morning totals job does). Tokens preseasonYYYY, archiveYYYY-MM-DD, historyY1-Y2 also work.
name: KenPom pull
on:
  workflow_dispatch:
  push:
    paths: ['triggers/kenpom.txt']
permissions:
  contents: write
concurrency:
  group: kenpom
  cancel-in-progress: false
jobs:
  kenpom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - name: Pull
        run: |
          for d in $(grep -v "^#" triggers/kenpom.txt | grep -oE "history[0-9]{4}-[0-9]{4}|preseason[0-9]{4}|archive[0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{4}-[0-9]{2}-[0-9]{2}|today|height"); do
            if [ "${d#history}" != "$d" ]; then python jobs/kenpom.py --history ${d#history}; elif [ "${d#preseason}" != "$d" ]; then python jobs/kenpom.py --preseason ${d#preseason}; elif [ "${d#archive}" != "$d" ]; then python jobs/kenpom.py --archive ${d#archive}; elif [ "$d" = "height" ]; then python jobs/kenpom.py --height; elif [ "$d" = "today" ]; then python jobs/kenpom.py; else python jobs/kenpom.py --date $d --fanmatch-only; fi
          done
        env:
          KENPOM_API_KEY: ${{ secrets.KENPOM_API_KEY }}
      - name: Save
        run: |
          git config user.name "dtp-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/kenpom
          git commit -m "kenpom pull" || echo "nothing new"
          git pull --rebase origin main && git push origin HEAD:main
