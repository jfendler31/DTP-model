# Daily card: three scheduled attempts (4:15, 4:40, 5:05 AM ET in EST). GitHub sometimes delays or drops scheduled runs;
# the first attempt that succeeds sends the card and later attempts see today's card already saved and skip.
name: Daily card
on:
  schedule:
    - cron: '15 9 * * *'
    - cron: '40 9 * * *'
    - cron: '5 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Card date YYYY-MM-DD (blank = today)'
        required: false
  push:
    paths: ['triggers/card.txt']
permissions:
  contents: write
jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl
      - name: Build slate (if missing) and email the card
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event_name }}" = "push" ]; then ARGS="$(grep -o -- '--date [0-9-]*' triggers/card.txt || true)"; fi
          python jobs/slate.py $ARGS
          # ratings (garbage time out, Nov 8): box pull -> play-by-play pass for yesterday's games -> ratings from the stored box + pbp totals
          if python jobs/ratings.py $ARGS --games-only; then
            timeout 900 python jobs/tempo.py || echo "play-by-play pass failed or timed out - ratings use box totals for games it missed"
            python jobs/ratings.py $ARGS --offline || echo "ratings job failed - card falls back to the last ratings file / prior"
          else
            echo "ratings job failed - card falls back to the last ratings file / prior"
          fi
          # scoreboard check (Nov 11): results vs the close with 3P and FT luck removed, next to the composite move -> data/ratings/scoreboard_<date>.csv
          python jobs/scoreboard.py || echo "scoreboard check failed - card unaffected"
          # player sync (Nov 10): retire overrides for players who have played (box score controls) or whom the tracker clears; flag gaps
          # Nov 14: pricing new overrides only on the pushed kickoff (4:15 task or a manual card.txt push), never on GitHub's late crons
          PRICE=""; if [ "${{ github.event_name }}" = "push" ]; then PRICE="--price"; fi
          python jobs/sync_overrides.py $(echo $ARGS | grep -o -- '--date [0-9-]*') $PRICE || echo "override sync failed - card uses overrides as-is"
          python jobs/card.py $ARGS
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CARD_TO: ${{ secrets.CARD_TO }}
      - name: Save the card and line snapshot
        run: |
          git config user.name "dtp-bot"; git config user.email "actions@users.noreply.github.com"
          git add cards data/lines data/slate_*.csv data/ratings data/ratings_current.csv data/games_2026-27.csv data/overrides.csv data/tracker || true
          git add data/tempo data/pbp || true
          git commit -m "card $(date -u +%F)" || echo "nothing new"
          git pull --rebase origin main && git push origin HEAD:main
