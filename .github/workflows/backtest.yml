# Backtest stores for past seasons, Nov-Dec only (jobs/backtest_pull.py): box scores, CBBD lines and play-by-play
# four-factor totals. On demand: put "--season 2025" (optionally --start/--end/--max-calls) in triggers/backtest.txt.
# Re-parse without CBBD calls: "--season 2025 --no-box --from-raw --raw-run <run id that uploaded backtest-raw>".
name: Backtest pull
on:
  workflow_dispatch:
  push:
    paths: ['triggers/backtest.txt']
permissions:
  contents: write
  actions: read
concurrency:
  group: backtest
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - name: Pull
        run: |
          ARGS="$(grep -v '^#' triggers/backtest.txt | head -1)"
          RUN="$(echo "$ARGS" | grep -oE -- '--raw-run [0-9]+' | grep -oE '[0-9]+' || true)"
          if [ -n "$RUN" ]; then gh run download "$RUN" -n backtest-raw -D data/backtest; ARGS="$(echo "$ARGS" | sed -E 's/--raw-run [0-9]+//')"; fi
          python jobs/backtest_pull.py $ARGS
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
      - name: Keep raw plays (re-parse later with --from-raw, no CBBD calls)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-raw
          path: data/backtest/raw_*
          retention-days: 90
          if-no-files-found: ignore
      - name: Save
        if: always()
        run: |
          git config user.name "dtp-bot"; git config user.email "actions@users.noreply.github.com"
          [ -d data/backtest ] && git add data/backtest
          git commit -m "backtest pull" || echo "nothing new"
          git pull --rebase origin main && git push origin HEAD:main
